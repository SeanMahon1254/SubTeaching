<script>
'use strict';
const KEY='coverme_demo_v1';
const uid=()=>typeof crypto.randomUUID==='function'?crypto.randomUUID():'cm-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const schools=[{id:'oak',name:'Oakfield Community School',area:'North Dublin',room:'G12'},{id:'elm',name:'Elmbridge College',area:'South Dublin',room:'B04'},{id:'river',name:'Riverbank Secondary School',area:'North Dublin',room:'A08'},{id:'hill',name:'Hillcrest Community College',area:'West Dublin',room:'C11'}];

function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Dublin'}).format(new Date())}
function addDays(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function monday(s){let d=new Date(s+'T12:00:00');return addDays(s,-((d.getDay()+6)%7))}

function seed(){let base=nextWorkday(today()),days=[base];for(let i=1;i<7;i++)days.push(nextWorkday(days[i-1]));let offers=Array.from({length:10},(_,i)=>({id:'o'+i,school:['oak','oak','elm','river','oak','hill','oak','river','elm','oak'][i],date:days[Math.floor(i/2)],start:i%2?'11:00':'09:00',end:i%2?'12:00':'10:00',subject:['Geography','Digital Technology','English','Geography','Geography','Mathematics','Digital Technology','English','Geography','Geography'][i],year:['2nd year','1st year','3rd year'][i%3],room:['G12','ICT 1','B04'][i%3],status:i<2?'accepted':'pending',deadline:days[Math.floor(i/2)]+'T'+(i%2?'10:30':'08:30'),notes:'Cover the topic in the linked lesson plan. Materials are available from the school office.'}));return {version:1,role:'teacher',page:'overview',profile:{name:'Alex Murphy',mode:'single',school:'oak',area:'North Dublin',subjects:['Geography','Digital Technology'],travel:30},offers,availability:Object.fromEntries(days.map(d=>[d,'Full day'])),plans:{o0:{topic:'Reading an Ordnance Survey map',objectives:'Identify four map symbols and use a six-figure grid reference.',activities:'Starter: identify familiar symbols (5 min).\nModel a grid reference (10 min).\nPaired map task (25 min).\nExit question and review (10 min).',resources:'Sample map worksheet, board and pencils.',assessment:'Check each pair’s grid references; collect exit answers.'}},tickets:[{id:'t1',type:'General query',subject:'Where can I collect the classroom key?',message:'Please confirm the collection point before my next cover lesson.',school:'oak',date:today(),status:'Acknowledged',reply:'Collect the sample key from reception.'},{id:'t2',type:'Leave request',subject:'Leave request for a college session',message:'Sample request for a future college session.',school:'oak',date:today(),start:days[5],end:days[5],status:'Submitted',reply:''}],notifications:[{id:'welcome',text:'Welcome to the sample workspace. Switch to school view to create a cover offer.',at:new Date().toISOString(),read:false}],school:'oak',week:monday(base),test:{tried:'',issue:'',changed:''}}}
let S;try{S=JSON.parse(localStorage.getItem(KEY));if(!S||S.version!==1)S=seed()}catch{S=seed()}let filter='pending';let toastTimer;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch{toast('Browser storage is unavailable. Changes cannot survive refresh.');return false}}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function notify(text){S.notifications.unshift({id:uid(),text,at:new Date().toISOString(),read:false});S.notifications=S.notifications.slice(0,60)}
function status(o){return o.status==='pending'&&new Date(o.deadline).getTime()<=Date.now()?'expired':o.status}
function matches(o){return S.profile.mode==='single'?o.school===S.profile.school:school(o.school).area===S.profile.area&&S.profile.subjects.includes(o.subject)}
function eligibleOffers(){return S.offers.filter(o=>matches(o)||o.status==='accepted')}
function overlap(a,b,buffer=0){return a.date===b.date&&(mins(a.start)<mins(b.end)+buffer&&mins(b.start)<mins(a.end)+buffer)}
function mins(t){let [h,m]=t.split(':').map(Number);return h*60+m}
function blockReason(o){if(status(o)!=='pending')return 'This offer is '+status(o)+'.';let av=S.availability[o.date]||'Unavailable';if(av==='Unavailable')return 'You are marked unavailable on this date.';if(av==='Morning'&&mins(o.end)>12*60+30)return 'This lesson is outside your morning availability.';if(av==='Afternoon'&&mins(o.start)<12*60+30)return 'This lesson is outside your afternoon availability.';let clash=[...S.offers.filter(belongs),...seasonalLessons()].find(b=>b.id!==o.id&&b.status==='accepted'&&overlap(o,b,o.school===b.school?0:Number(S.profile.travel)));return clash?'Clashes with a confirmed lesson or your cross-school travel buffer.':''}

function header(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${S.role==='teacher'?'Teacher workspace':S.role==='board'?'Exam body workspace':'School workspace'} · Sample data</div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function render(){ensureSeasonal();ensureNetwork();ensureHourlyAvailability();document.getElementById('nav').innerHTML=(S.role==='teacher'?linksTeacher:S.role==='board'?linksBoard:linksSchool).map(([p,i,n])=>`<button class="${S.page===p?'active':''}" onclick="nav('${p}')" ${S.page===p?'aria-current="page"':''}><span class="navicon" aria-hidden="true">${i}</span>${n}</button>`).join('');document.getElementById('roleBtn').value=S.role;document.getElementById('teacherPreviewWrap').hidden=S.role!=='teacher';document.getElementById('teacherPreview').innerHTML=teachers.map((n,i)=>`<option value="t${i}" ${activeId()==='t'+i?'selected':''}>${esc(n)}</option>`).join('');document.getElementById('alertCount').textContent=S.notifications.filter(n=>!n.read).length||'';let pages={overview:S.role==='teacher'?overview:S.role==='board'?boardOverview:schoolOverview,summer:summerPage,offers:offersPage,timetable:timetable,plans:plansPage,availability:availabilityPage,portal:portalPage,settings:settingsPage,about:aboutPage,manage:managePage,staff:staffPage};document.getElementById('main').innerHTML=(pages[S.page]||overview)()+`<footer class="footer">Sub Teaching · Fictional student project · All records are sample data.<br>Saved on this browser only. No real accounts, messages or push notifications. No school or examination-body affiliation. Please do not enter personal or pupil information.</footer>`}
function setRole(role){seasonalFilter='All';S.role=role;S.earningsSchool='all';S.page='overview';persist();render();toast('Previewing '+(role==='board'?'exam body':role)+' view. Fictional demonstration only.')}
function illustration(){return `<svg viewBox="0 0 340 210" role="img" aria-label="Illustration of a teacher beside a school and lesson board"><circle cx="215" cy="106" r="95" fill="#7684c3"/><path d="M152 84l66-42 67 42v93H152z" fill="#eef0ff"/><path d="M141 85l77-52 79 52" fill="none" stroke="#b3d99e" stroke-width="12" stroke-linejoin="round"/><path d="M206 133h26v44h-26z" fill="#5367a9"/><g fill="#a0c4e9"><path d="M170 98h22v22h-22zm76 0h22v22h-22zm-76 36h22v22h-22zm76 0h22v22h-22z"/></g><circle cx="218" cy="77" r="11" fill="#fff"/><path d="M218 70v8l5 3" stroke="#6354a6" fill="none" stroke-width="2"/><rect x="30" y="94" width="96" height="65" rx="5" fill="#41487e" stroke="#a4c9ec" stroke-width="3"/><path d="M45 113h58m-58 12h38m-38 12h50" stroke="#e7f5e2" stroke-width="3" stroke-linecap="round"/><path d="M45 160l-8 27m73-27 8 27" stroke="#bbb0df" stroke-width="5"/><circle cx="137" cy="99" r="15" fill="#dca67e"/><path d="M122 96q0-25 21-14l9 15-17-6z" fill="#26312a"/><path d="M116 167l9-49q13-9 26 0l9 49" fill="#a9c7ed"/><path d="M127 165l-3 29m23-29 6 29" stroke="#e9e4ce" stroke-width="11" stroke-linecap="round"/><path d="M125 126l-18 18-14-8m54-9 16 13" stroke="#dca67e" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M16 197h300" stroke="#a9c7ed" stroke-width="3"/><path d="M296 169v25m-10-39q10-29 20 0v19h-20z" fill="#b3d99e"/><path d="M33 52l4-8 4 8 9 2-9 3-4 8-4-8-9-3z" fill="#b9db9f"/></svg>`}
function stat(n,t){return `<div class="stat"><strong>${n}</strong><span>${t}</span></div>`}
function offerCard(o,compact=false){let st=status(o),reason=st==='pending'?blockReason(o):'',deadline=displayDate(o.deadline.slice(0,10))+' · '+o.deadline.slice(11,16);return `<article class="offer"><div class="offer-top"><div><div class="eyebrow">${esc(school(o.school).area)}</div><h3>${esc(o.subject)} · ${esc(o.year)}</h3><div class="muted">${esc(school(o.school).name)}</div></div>${badge(st)}</div><p class="meta">${displayDate(o.date)} · ${esc(o.start)}–${esc(o.end)} · Room ${esc(o.room)}</p>${compact?'':`<p class="meta">${esc(o.notes)}</p>`}${st==='pending'?`<div class="small">Respond by ${deadline}</div>${reason?`<p class="reason">${reason}</p>`:''}<div class="actions"><button class="primary" onclick="respond('${o.id}','accepted')" ${reason?'disabled':''}>Accept cover</button><button onclick="respond('${o.id}','declined')">Decline</button></div>`:st==='accepted'?`<div class="actions"><button onclick="editPlan('${o.id}')">${S.plans[o.id]?'Open':'Create'} lesson plan</button></div>`:''}</article>`}
function overview(){let list=eligibleOffers(),pending=list.filter(o=>status(o)==='pending'),accepted=S.offers.filter(o=>belongs(o)&&o.status==='accepted'&&new Date(o.date+'T'+o.end)>new Date()),tom=nextWorkday(today()),tomLessons=accepted.filter(o=>o.date===tom);return header('A clearer week ahead, Alex.',displayDate(today(),{weekday:'long',day:'numeric',month:'long'}))+`<section class="hero"><div><div class="eyebrow">Less chasing. More teaching.</div><h2>Your next lesson starts with a little clarity.</h2><p>Cover offers, lesson plans and school conversations. One calm place to organise your teaching week.</p><button onclick="nav('offers')">View cover offers →</button></div>${illustration()}</section><div class="stats">${stat(pending.length,'Offers awaiting your response')}${stat(accepted.length,'Upcoming confirmed lessons')}${stat(accepted.filter(o=>S.plans[o.id]?.topic).length,'Lessons with a saved plan')}${stat(S.tickets.filter(t=>t.status==='Submitted').length,'Requests awaiting acknowledgement')}</div><div class="grid"><section><div class="cardhead"><h2>Your cover inbox</h2><button onclick="nav('offers')">View all</button></div>${pending.slice(0,2).map(o=>offerCard(o,true)).join('')||'<div class="empty">No pending offers match your preferences.</div>'}</section><section><div class="card soft"><div class="eyebrow">Next school day · ${displayDate(tom)}</div><h2>${tomLessons.length?'You have '+tomLessons.length+' confirmed lessons.':'No cover confirmed yet.'}</h2><p class="muted">${tomLessons.length?'Your confirmed lessons are below. Check your timetable for the full week.':'This is not a day-off confirmation. New offers may still arrive; this prototype only alerts while open.'}</p>${tomLessons.map(o=>`<div class="row"><div class="datebox"><strong>${o.start}</strong>${o.end}</div><div><strong>${esc(o.subject)}</strong><div class="small">${esc(school(o.school).name)}</div></div></div>`).join('')}<div class="actions"><button onclick="nav('timetable')">Open timetable</button></div></div><div class="card"><h3>Your working setup</h3><p class="muted">${S.profile.mode==='single'?'One school · '+esc(school(S.profile.school).name):'Multiple schools · '+esc(S.profile.area)}</p><button onclick="nav('settings')">Change preferences</button></div></section></div>`}
function offersPage(){let list=eligibleOffers().filter(o=>filter==='all'||status(o)===filter);return header('Cover offers','Clear details. Your choice. Confirmed work goes straight into your timetable.')+`<div class="tabs">${['pending','accepted','declined','expired','all'].map(x=>`<button class="${filter===x?'selected':''}" onclick="filter='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="notice green">Offers match your ${S.profile.mode==='single'?'designated school':'selected area and subjects'}. Set your availability before accepting. Accepted lessons stay visible if preferences change.</div>${list.map(o=>offerCard(o)).join('')||'<div class="empty">No offers in this view. Try another filter or create one from school view.</div>'}`}
function respond(id,result){let o=S.offers.find(o=>o.id===id);if(!o||!belongs(o)){toast('This offer belongs to another sample teacher.');return}if(result==='accepted'){let reason=blockReason(o);if(reason){toast(reason);render();return}}else if(status(o)!=='pending'){toast('This offer is no longer available.');render();return}o.status=result;notify(`${o.subject} at ${school(o.school).name} on ${displayDate(o.date)}: ${result}.`);persist();render();toast(result==='accepted'?'Cover confirmed. Your timetable has been updated.':'Offer declined.')}
function timetable(){let start=S.week,accepted=[...S.offers.filter(o=>belongs(o)&&o.status==='accepted'),...seasonalLessons()];return header('My week',teacherName(activeId())+' · Your confirmed work. Tap a lesson to view or edit its plan.')+`<div class="toolbar"><button onclick="changeWeek(-7)" aria-label="Previous week">←</button><strong>${displayDate(start)} – ${displayDate(addDays(start,4))}</strong><button onclick="changeWeek(7)" aria-label="Next week">→</button><button onclick="S.week=monday(today());persist();render()">This week</button></div><div class="week">${Array.from({length:5},(_,i)=>{let d=addDays(start,i),list=accepted.filter(o=>o.date===d).sort((a,b)=>a.start.localeCompare(b.start));return `<section class="day"><h3>${displayDate(d)}</h3><div class="small" style="margin-bottom:10px">${list.some(o=>o.seasonal)?'Holiday work booked':esc(availabilityLabel(activeId(),d))}</div>${list.map(o=>`<article class="lesson"><strong>${o.start}–${o.end}</strong><strong>${esc(o.subject)}</strong><div>${esc(o.year)} · ${esc(o.room)}</div><div class="meta">${esc(o.seasonal?o.organiser:school(o.school).name)}</div>${o.seasonal?'<span class="badge accepted">Holiday work confirmed</span>':`${o.seriesId?'<span class="badge">Repeats weekly · sample</span><br>':''}<span class="badge">${S.plans[o.id]?.topic?'Plan saved':'Needs a plan'}</span><br><button onclick="editPlan('${o.id}')">Lesson plan</button>`}</article>`).join('')||'<p class="small">No confirmed lessons</p>'}</section>`}).join('')}</div>`}

function plansPage(){let list=S.offers.filter(o=>belongs(o)&&o.status==='accepted').sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));return header('A little preparation goes a long way.','Lesson plans are linked to your confirmed cover bookings.')+`<div class="notice">Use sample teaching content only. Do not enter pupil names, learning needs or other personal information.</div>${list.map(o=>`<div class="card"><div class="cardhead"><div><span class="eyebrow">${displayDate(o.date)} · ${o.start}</span><h3>${esc(o.subject)} · ${esc(o.year)}</h3><span class="small">${esc(school(o.school).name)}</span></div>${badge(S.plans[o.id]?.topic?'Plan saved':'Needs a plan')}</div><p>${esc(S.plans[o.id]?.topic||'Start with an objective, an activity and a quick check for understanding.')}</p><button onclick="editPlan('${o.id}')">${S.plans[o.id]?'Edit':'Create'} lesson plan</button></div>`).join('')||'<div class="empty">Accept a cover offer to start a linked lesson plan.</div>'}`}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').showModal()}
function editPlan(id){let o=S.offers.find(x=>x.id===id),p=S.plans[id]||{};modal('Plan your lesson',`<p class="muted">${esc(o.subject)} · ${displayDate(o.date)} · ${o.start}–${o.end}</p><form onsubmit="savePlan(event,'${id}')"><div class="formgrid"><label class="full">Lesson topic<input name="topic" required maxlength="120" value="${esc(p.topic||'')}"></label><label class="full">Learning objectives<textarea name="objectives" required maxlength="1500">${esc(p.objectives||'')}</textarea></label><label class="full">Activities and timings<textarea name="activities" required maxlength="3000">${esc(p.activities||'')}</textarea></label><label>Resources<textarea name="resources" maxlength="1500">${esc(p.resources||'')}</textarea></label><label>Check for understanding<textarea name="assessment" maxlength="1500">${esc(p.assessment||'')}</textarea></label></div><div class="actions"><button class="primary">Save lesson plan</button><button type="button" onclick="document.getElementById('modal').close()">Cancel</button></div></form>`)}
function savePlan(e,id){e.preventDefault();if(!S.offers.some(o=>o.id===id&&belongs(o)))return;S.plans[id]=Object.fromEntries(new FormData(e.target));persist();document.getElementById('modal').close();render();toast('Lesson plan saved on this browser.')}
function availabilityPage(){let days=Array.from({length:14},(_,i)=>addDays(today(),i)).filter(d=>![0,6].includes(new Date(d+'T12:00').getDay()));return header('Tell schools when you can teach.','Availability is a preference, not a booking. Confirmed lessons require a separate cancellation.')+`<form onsubmit="saveAvailability(event)" class="card"><div class="formgrid">${days.map(d=>`<label>${displayDate(d)}<select name="${d}">${['Unavailable','Full day','Morning','Afternoon'].map(x=>`<option ${S.availability[d]===x?'selected':''}>${x}</option>`).join('')}</select></label>`).join('')}</div><p class="small" style="margin-top:18px">Morning: lessons ending by 12:30. Afternoon: lessons starting at or after 12:30.</p><button class="primary">Save availability</button></form>`}
function saveAvailability(e){e.preventDefault();let changes=Object.fromEntries(new FormData(e.target));for(let [d,v]of Object.entries(changes)){let bookings=[...S.offers.filter(belongs),...seasonalLessons()].filter(o=>o.status==='accepted'&&o.date===d);if(bookings.some(o=>v==='Unavailable'||v==='Morning'&&mins(o.end)>750||v==='Afternoon'&&mins(o.start)<750)){toast('Availability conflicts with confirmed cover on '+displayDate(d)+'. Ask the school to cancel it first.');return}}Object.assign(S.availability,changes);persist();render();toast('Availability saved.')}
function settingsPage(){return header('Make Sub Teaching fit your week.','Choose one school or make yourself available in a selected area.')+`<form class="card" onsubmit="saveSettings(event)"><div class="formgrid"><label>Working arrangement<select name="mode" id="mode" onchange="toggleMode()"><option value="single" ${S.profile.mode==='single'?'selected':''}>One designated school</option><option value="multi" ${S.profile.mode==='multi'?'selected':''}>Multiple schools in an area</option></select></label><label id="schoolField">Designated school<select name="school">${schools.filter(x=>(PANEL_IDS[x.id]||[]).includes(activeId())).map(x=>`<option value="${x.id}" ${S.profile.school===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label><label id="areaField">Preferred area<select name="area">${['North Dublin','South Dublin','West Dublin'].map(x=>`<option ${x===S.profile.area?'selected':''}>${x}</option>`).join('')}</select></label><label>Travel buffer between schools (minutes)<input name="travel" type="number" min="15" max="180" required value="${S.profile.travel}"></label><div class="full"><label>Subjects you can offer</label><div class="checks" style="margin-top:8px">${['Geography','Digital Technology','English','Mathematics'].map(x=>`<label><input type="checkbox" name="subjects" value="${x}" ${S.profile.subjects.includes(x)?'checked':''}>${x}</label>`).join('')}</div></div></div><p class="small" style="margin-top:18px">Area matching is a sample filter, not live distance routing. Subject preferences are not a verification of teaching eligibility. No qualification checks are performed in this prototype.</p><button class="primary">Save preferences</button></form>`}
function toggleMode(){let multi=document.getElementById('mode').value==='multi';document.getElementById('schoolField').hidden=multi;document.getElementById('areaField').hidden=!multi}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target),subjects=f.getAll('subjects');if(!subjects.length){toast('Choose at least one subject.');return}Object.assign(S.profile,{mode:f.get('mode'),school:f.get('school'),area:f.get('area'),travel:Number(f.get('travel')),subjects});persist();render();toast('Preferences saved. Your cover inbox now uses these settings.')}
function portalPage(){if(S.role==='teacher'&&S.profile.mode!=='single')return header('School correspondence','Your designated-school portal.')+`<div class="card"><h2>This portal is for teachers linked to one school.</h2><p>In multiple-school mode, each booking includes school instructions. A private ongoing staff portal becomes available when you choose a designated school.</p><button onclick="nav('settings')">Change working arrangement</button></div>`;let sid=S.role==='school'?S.school:S.profile.school,list=S.tickets.filter(t=>t.school===sid&&(S.role==='school'||(t.teacherId||'t0')===activeId()));return header(S.role==='school'?'Staff requests':'School messages',esc(school(sid).name),S.role==='teacher'?'<button class="primary" onclick="newTicket()">New request +</button>':'')+(S.role==='school'?schoolSelect():'')+`<div class="notice green">Sickness is reported, not approved. Reporting it here does not cancel confirmed teaching; the coordinator must arrange replacement cover.</div>${list.map(t=>`<article class="card"><div class="cardhead"><div><span class="eyebrow">${esc(t.type)} · ${displayDate(t.date)}</span><h3>${esc(t.subject)}</h3></div>${badge(t.status)}</div>${t.start?`<p class="small">${displayDate(t.start)} – ${displayDate(t.end)}</p>`:''}<p>${esc(t.message)}</p>${t.reply?`<div class="notice green"><strong>School response:</strong> ${esc(t.reply)}</div>`:''}${S.role==='school'?`<button onclick="replyTicket('${t.id}')">Respond / update status</button>`:''}</article>`).join('')||'<div class="empty">No requests for this school yet.</div>'}`}
function newTicket(){modal('New school request',`<form onsubmit="saveTicket(event)"><div class="formgrid"><label>Request type<select name="type" onchange="document.getElementById('requestDates').hidden=this.value==='General query'||this.value==='Pay query'||this.value==='Personal details query'"><option>General query</option><option>Leave request</option><option>Sickness report</option><option>Pay query</option><option>Personal details query</option></select></label><label>Subject<input name="subject" maxlength="100" required></label><div class="full formgrid" id="requestDates" hidden><label>From<input type="date" name="start" min="${today()}"></label><label>To<input type="date" name="end" min="${today()}"></label></div><label class="full">Sample message<textarea name="message" required maxlength="2000" placeholder="Use fictional details only. Do not enter health, bank or identity information."></textarea></label></div><p class="small">Saved locally in this demonstration. Nothing is sent to a school.</p><button class="primary">Submit sample request</button></form>`)}
function saveTicket(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),dated=['Leave request','Sickness report'].includes(f.type);if(dated&&(!f.start||!f.end||f.end<f.start)){toast('Choose a valid start and end date.');return}S.tickets.unshift({...f,start:dated?f.start:null,end:dated?f.end:null,id:uid(),teacherId:activeId(),school:S.profile.school,date:today(),status:'Submitted',reply:''});notify('New '+f.type.toLowerCase()+': '+f.subject);persist();document.getElementById('modal').close();render();toast('Sample request added to the school queue.')}
function replyTicket(id){let t=S.tickets.find(x=>x.id===id),options=t.type==='Leave request'?['Submitted','Acknowledged','Approved','Declined']:['Submitted','Acknowledged','Resolved'];modal('Respond to staff request',`<p>${esc(t.subject)}</p><form onsubmit="saveReply(event,'${id}')"><label>Status<select name="status">${options.map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></label><label style="margin-top:15px">School response<textarea name="reply" required maxlength="2000">${esc(t.reply)}</textarea></label><div class="actions"><button class="primary">Save response</button></div></form>`)}
function saveReply(e,id){e.preventDefault();let t=S.tickets.find(x=>x.id===id);Object.assign(t,Object.fromEntries(new FormData(e.target)));notify('School response to “'+t.subject+'”: '+t.status+'.');persist();document.getElementById('modal').close();render();toast('Response saved. Visible in teacher view.')}
function schoolSelect(){return `<div class="toolbar"><label>Demonstration school<select onchange="S.school=this.value;persist();render()">${schools.map(x=>`<option value="${x.id}" ${x.id===S.school?'selected':''}>${x.name}</option>`).join('')}</select></label></div>`}
function schoolOverview(){let offers=S.offers.filter(o=>o.school===S.school),pending=offers.filter(o=>status(o)==='pending'),unread=S.tickets.filter(t=>t.school===S.school&&t.status==='Submitted');return header('Keep your school day covered.',esc(school(S.school).name),'<button class="primary" onclick="newOffer()">Offer cover +</button>')+schoolSelect()+`<section class="hero"><div><div class="eyebrow">School cover desk</div><h2>From an empty classroom to confirmed cover.</h2><p>Create an offer, follow the response and keep instructions together. All interactions here use fictional sample data.</p><button onclick="nav('manage')">Manage cover →</button></div>${illustration()}</section><div class="stats">${stat(pending.length,'Offers awaiting a teacher')}${stat(offers.filter(o=>o.status==='accepted').length,'Confirmed lessons')}${stat(pending.filter(o=>new Date(o.deadline)-Date.now()<86400000).length,'Unfilled · response due within 24 hours')}${stat(unread.length,'Staff requests to acknowledge')}</div><div class="grid"><div class="card"><h2>Cover needing attention</h2>${pending.map(o=>`<div class="row"><div class="datebox"><strong>${o.start}</strong>${displayDate(o.date,{day:'numeric',month:'short'})}</div><div class="grow"><strong>${esc(o.subject)}</strong><div class="small">${esc(o.year)} · Room ${esc(o.room)}</div></div>${badge('pending')}</div>`).join('')||'<p class="muted">No pending cover offers.</p>'}<div class="actions"><button onclick="nav('manage')">Open cover desk</button></div></div><div class="card soft"><h2>Try both sides</h2><p>Choose a sample teacher and create an offer for an available lesson time. Choose Teacher in Demo view, accept it, then return here to see the confirmation.</p><p class="small">The preview role selector is a demonstration control. It provides no privacy or access protection.</p></div></div>`}
function managePage(){let list=S.offers.filter(o=>o.school===S.school).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));return header('Your cover desk','Create offers and track responses without chasing a message thread.','<button class="primary" onclick="newOffer()">Offer cover +</button>')+schoolSelect()+list.map(o=>`<article class="card"><div class="cardhead"><div><div class="eyebrow">${displayDate(o.date)} · ${o.start}–${o.end}</div><h3>${esc(o.subject)} · ${esc(o.year)}</h3><div class="small">Room ${esc(o.room)} · ${o.status==='accepted'?'Confirmed with '+teacherName(o.teacherId):'Sample offer for '+teacherName(o.teacherId)}</div></div>${badge(status(o))}</div><p class="meta">Response deadline: ${displayDate(o.deadline.slice(0,10))} ${o.deadline.slice(11,16)}</p>${status(o)==='pending'&&new Date(o.deadline)-Date.now()<86400000?'<div class="notice">Unfilled and due within 24 hours. Coordinator attention needed.</div>':''}${['pending','accepted'].includes(status(o))?`<button class="danger" onclick="cancelOffer('${o.id}')">Cancel cover offer</button>`:''}</article>`).join('')}
function newOffer(){let d=nextWorkday(today());modal('Offer a cover lesson',`<form onsubmit="saveOffer(event)"><div class="formgrid"><label>School<select name="school">${schools.map(x=>`<option value="${x.id}" ${x.id===S.school?'selected':''}>${x.name}</option>`).join('')}</select></label><label>Lesson date<input type="date" name="date" min="${today()}" required value="${d}"></label><label>Subject<select name="subject"><option>Geography</option><option>Digital Technology</option><option>English</option><option>Mathematics</option></select></label><label>Year group<select name="year"><option>1st year</option><option>2nd year</option><option>3rd year</option><option>Transition year</option><option>5th year</option><option>6th year</option></select></label><label>Start time<input type="time" name="start" value="13:30" required></label><label>End time<input type="time" name="end" value="14:30" required></label><label>Room<input name="room" required maxlength="40" value="G12"></label><label>Respond by (local time)<input type="datetime-local" name="deadline" value="${d}T12:30" required></label><label class="full">Lesson instructions<textarea name="notes" required maxlength="1500">Sample cover instructions: collect the worksheet from reception.</textarea></label></div><p class="small">This creates an offer for sample teacher Alex. It appears in their inbox if their school/area and subject preferences match.</p><button class="primary">Create cover offer</button></form>`)}
function saveOffer(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),start=new Date(f.date+'T'+f.start),deadline=new Date(f.deadline);if(f.end<=f.start||start<=new Date()||deadline<=new Date()||deadline>start){toast('Use a future lesson, an end after its start and a future response deadline no later than lesson start.');return}if(S.offers.some(o=>o.school===f.school&&o.room.toLowerCase()===f.room.toLowerCase()&&!['cancelled','declined'].includes(o.status)&&overlap(o,f))){toast('That school room already has an overlapping cover request.');return}let o={...f,id:uid(),status:'pending'};S.offers.unshift(o);notify('New cover offer: '+f.subject+' at '+school(f.school).name+' on '+displayDate(f.date)+'.');persist();document.getElementById('modal').close();render();toast('Offer created. Choose Teacher in Demo view to respond.')}
function cancelOffer(id){let o=S.offers.find(x=>x.id===id);modal('Cancel this cover?',`<p>${esc(o.subject)} · ${displayDate(o.date)} · ${o.start}</p><p>The lesson will leave the confirmed timetable. Its saved plan will be retained in browser storage.</p><button class="danger" onclick="confirmCancel('${id}')">Confirm cancellation</button>`)}
function confirmCancel(id){let o=S.offers.find(x=>x.id===id);o.status='cancelled';notify('Cover cancelled: '+o.subject+' on '+displayDate(o.date)+'.');persist();document.getElementById('modal').close();render();toast('Cover cancelled and teacher alerted in-app.')}
function staffPage(){let d=nextWorkday(today());return header('Available teachers','Eight fictional teacher records. Alex’s availability is interactive; other profiles are illustrative.')+schoolSelect()+`<div class="card"><label>Check date<input type="date" id="staffDate" value="${d}" onchange="document.getElementById('staffList').innerHTML=staffRows(this.value)"></label><div id="staffList">${staffRows(d)}</div></div>`}
function staffRows(d){return teachers.map((n,i)=>{let av=i===0?(S.availability[d]||'Unavailable'):['Full day','Morning','Unavailable','Afternoon'][i%4],bookings=i===0?S.offers.filter(o=>belongs(o)&&o.status==='accepted'&&o.date===d).length:0;return `<div class="listline"><div class="avatar">${n.split(' ').map(x=>x[0]).join('')}</div><div class="grow"><strong>${n}</strong><div class="small">${i===0?esc(S.profile.subjects.join(' · ')):['English · Geography','Mathematics','Digital Technology'][i%3]}${i===0&&bookings?' · '+bookings+' confirmed lessons':''}</div></div>${badge(av)}</div>`}).join('')}
function showAlerts(){modal('In-app notifications',`<p class="small">Shared demonstration activity feed. No push, email or SMS is sent. Alerts are visible only in this browser.</p><button onclick="S.notifications.forEach(n=>n.read=true);persist();render();document.getElementById('modal').close()">Mark all as read</button><div style="margin-top:15px">${S.notifications.map(n=>`<div class="notification"><strong>${n.read?'':'• '}${esc(n.text)}</strong><div class="small">${new Date(n.at).toLocaleString('en-IE')}</div></div>`).join('')||'No alerts yet.'}</div>`)}
function aboutPage(){return header('Built to make cover clearer.','What the demo does, future development and testing notes.')+`<div class="notice">Fictional concept for Irish secondary-school student substitutes and school cover coordinators. This is the demo, not the final project landing page.</div><div class="card"><h2>What works here</h2><div class="tablewrap"><table><thead><tr><th>User requirement</th><th>Demonstrated behaviour</th></tr></thead><tbody><tr><td>Choose one school or several nearby</td><td>Preferences filter offers by designated school, or area and subjects.</td></tr><tr><td>Receive and respond to offers</td><td>School-created offers, in-app alerts, accept/decline and automatic expiry. Summer roles support applications, organiser decisions and teacher acceptance.</td></tr><tr><td>A dependable weekly schedule</td><td>Accepted lessons populate the timetable; overlap and travel-buffer checks block conflicting acceptance.</td></tr><tr><td>Prepare lessons</td><td>Save objectives, timed activities, resources and assessment against confirmed lessons.</td></tr><tr><td>Communicate with a designated school</td><td>Submit leave, sickness and query records; school responses update their status.</td></tr><tr><td>Keep changes after a refresh</td><td>Browser local storage retains demonstration records and preferences.</td></tr></tbody></table></div></div><div class="card"><h2>Planned for a real service</h2><ul class="help-list"><li>Secure, verified school and teacher accounts with private access.</li><li>Server storage shared across devices and schools.</li><li>Background push/email alerts with delivery tracking.</li><li>Verified teacher eligibility and school onboarding.</li><li>Real travel routing and configurable school schedules.</li></ul><p class="small">A proposed school subscription would fund the service. Pricing is not validated and is not charged in this prototype.</p></div><div class="card"><h2>Real-person testing record</h2><p class="muted">After someone who did not build the demo tries it, record what they did, what confused them and any changes made. Use actual observations and sample information only.</p><form onsubmit="saveTest(event)"><div class="formgrid"><label class="full">What did the tester try?<textarea name="tried" required maxlength="1500">${esc(S.test.tried)}</textarea></label><label>What broke or confused them?<textarea name="issue" required maxlength="1500">${esc(S.test.issue)}</textarea></label><label>What did you change?<textarea name="changed" required maxlength="1500">${esc(S.test.changed)}</textarea></label></div><p class="small">Saved only in this browser. Export the record to keep it, then include verified findings on the final landing page.</p><div class="actions"><button class="primary">Save testing notes</button><button type="button" onclick="exportTest()">Download testing notes</button></div></form></div><div class="card"><h2>Try the core journey</h2><ol class="help-list"><li>Choose School in Demo view and create a Geography offer at Oakfield for an available future date, outside existing lessons.</li><li>Choose Teacher in Demo view, select a school arrangement and open My day.</li><li>Accept the offer. Find it in the weekly timetable.</li><li>Create a lesson plan and refresh to check it remains saved.</li><li>Submit a sample school query, then respond from school view.</li><li>Try an overlapping offer and confirm acceptance is blocked.</li></ol><button class="danger" onclick="resetDemo()">Reset all sample data</button></div>`}
function saveTest(e){e.preventDefault();S.test=Object.fromEntries(new FormData(e.target));persist();toast('Testing notes saved locally. Export them to keep a copy.')}
function exportTest(){let b=new Blob(['Sub Teaching real-person testing record\n\n'+Object.entries(S.test).map(([k,v])=>k.toUpperCase()+':\n'+v).join('\n\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sub-teaching-testing-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetDemo(){modal('Reset the demo?',`<p>This removes all your local edits, plans and testing notes and restores fictional sample records. Export testing notes first if needed.</p><button class="danger" onclick="S=seed();persist();document.getElementById('modal').close();render();toast('Sample data restored.')">Reset sample data</button>`)}
function ensureSeasonal(){if(S.opportunities)return;let yr=Number(today().slice(0,4))+1;S.opportunities=Array.from({length:8},(_,i)=>{let kind=i%3===2?'Exam supervision':i%3===1?'Summer course':'School camp',d=yr+'-'+(kind==='Exam supervision'?'06':'07')+'-'+String(7+Math.floor(i/3)*7).padStart(2,'0');return {id:'summer'+i,kind,title:kind==='Exam supervision'?'Examination room supervisor':kind==='Summer course'?'Summer learning course tutor':'Holiday activity camp teacher',school:['oak','river','board','elm','oak','board','hill','river'][i],organiser:kind==='Exam supervision'?'Sample National Examination Office':school(['oak','river','oak','elm','oak','oak','hill','river'][i]).name,area:['North Dublin','North Dublin','South Dublin','South Dublin','North Dublin','West Dublin','West Dublin','North Dublin'][i],from:d,to:addDays(d,4),start:'09:00',end:'13:00',deadline:addDays(d,-14),places:2,rate:kind==='Exam supervision'?100:120,details:kind==='Exam supervision'?'Fictional examination-room supervision opportunity. All appointments require organiser verification; this app does not establish eligibility.':'Fictional holiday programme. Support the listed activities and follow the organiser’s safeguarding procedures.',requirements:'Sample requirement: relevant teaching experience and organiser verification before appointment.',closed:false}});S.applications=[]}
let seasonalFilter='All';
function postingClosed(p){return p.closed||today()>p.deadline}
function ownPosts(){return S.opportunities.filter(p=>S.role==='board'?p.school==='board':p.school===S.school)}
function applicationFor(id){return S.applications.find(a=>a.post===id&&(a.teacherId||'t0')===activeId())}
function remainingPlaces(p){return p.places-S.applications.filter(a=>a.post===p.id&&['Offered','Accepted'].includes(a.status)).length}
function onWeekday(d){return ![0,6].includes(new Date(d+'T12:00').getDay())}
function postDays(p){let ds=[];for(let d=p.from;d<=p.to;d=addDays(d,1))if(onWeekday(d))ds.push(d);return ds}

function seasonClash(p){let bookings=[...S.offers.filter(o=>belongs(o)&&o.status==='accepted'),...seasonalLessons()];return postDays(p).some(d=>bookings.some(b=>overlap({date:d,start:p.start,end:p.end},b,b.school===p.school?0:Number(S.profile.travel))))}
function boardOverview(){let posts=ownPosts(),apps=S.applications.filter(a=>posts.some(p=>p.id===a.post));return header('Coordinate examination supervision.','A proposed recruitment workspace for education and examination bodies.','<button class="primary" onclick="newSeasonalPost()">Post supervision role +</button>')+`<section class="hero"><div><div class="eyebrow">Exam body · demonstration</div><h2>One place to publish, review and confirm.</h2><p>Explore how an examination body could invite applications and manage supervision offers. No real exam body is connected to this prototype.</p><button onclick="nav('summer')">Open recruitment desk →</button></div>${illustration()}</section><div class="stats">${stat(posts.filter(p=>!postingClosed(p)).length,'Open sample supervision roles')}${stat(apps.filter(a=>a.status==='Applied').length,'Applications awaiting review')}${stat(apps.filter(a=>a.status==='Offered').length,'Offers awaiting teacher acceptance')}${stat(apps.filter(a=>a.status==='Accepted').length,'Confirmed sample appointments')}</div><div class="card"><h2>Appointments stay with the organiser.</h2><p>Schools and examination bodies review applications and make decisions. Applications and offers here are simulated. Identity, eligibility, training and appointment checks are planned for a real service.</p></div>`}
function summerPage(){let teacher=S.role==='teacher',posts=teacher?S.opportunities:ownPosts();posts=posts.filter(p=>seasonalFilter==='All'||p.kind===seasonalFilter);return header('Summer Work',teacher?'Discover camps, summer courses and examination supervision.':S.role==='board'?'Publish supervision roles and review sample applications.':'Publish your school’s camps and courses, then review applications.',teacher?'':'<button class="primary" onclick="newSeasonalPost()">Post opportunity +</button>')+(!teacher&&S.role!=='board'?schoolSelect():'')+`<div class="notice">All opportunities, dates, rates and examination bodies below are fictional sample data. Nothing is submitted to a real organisation. Supervisor eligibility and official appointment processes are not verified here.</div><div class="tabs">${['All','School camp','Summer course','Exam supervision'].filter(x=>teacher||x==='All'||(S.role==='board'?x==='Exam supervision':x!=='Exam supervision')).map(x=>`<button class="${seasonalFilter===x?'selected':''}" onclick="seasonalFilter='${x}';render()">${x}</button>`).join('')}</div>${teacher?'<p class="small">Holiday opportunities are shown separately from term-time school preferences. Applying confirms interest in all listed weekdays; the organiser must still review suitability. The area and programme dates are shown on every role.</p>':''}${posts.map(p=>seasonalCard(p,teacher)).join('')||'<div class="empty">No opportunities in this view. Choose another category or post a new role.</div>'}`}
function seasonalCard(p,teacher){let a=applicationFor(p.id),closed=postingClosed(p),count=remainingPlaces(p),applicants=S.applications.filter(a=>a.post===p.id),days=postDays(p).length,hours=(mins(p.end)-mins(p.start))/60*days;return `<article class="card"><div class="cardhead"><div><div class="eyebrow">${esc(p.kind)} · ${esc(p.area)}</div><h2>${esc(p.title)}</h2><div class="muted">${esc(p.organiser)}</div></div>${badge(closed?'Closed':count<=0?'Full':'Open')}</div><p class="meta">${displayDate(p.from,{day:'numeric',month:'short',year:'numeric'})} – ${displayDate(p.to,{day:'numeric',month:'short',year:'numeric'})} · Weekdays ${p.start}–${p.end}<br>${days} working days · ${hours} scheduled hours · ${Math.max(0,count)} of ${p.places} places available</p><p>${esc(p.details)}</p><div class="notice green"><strong>Sample rate: €${p.rate} / day</strong> · €${p.rate*days} illustrative total before deductions. Not an official pay rate.</div><p class="small">${esc(p.requirements)}<br>Applications close ${displayDate(p.deadline)} at end of day in Ireland.</p>${teacher?`<div class="actions">${!a&&!closed&&count>0?`<button class="primary" onclick="applySeasonal('${p.id}')">Apply for this role</button>`:a?`${badge(a.status)}${a.status==='Offered'?`<button class="primary" onclick="acceptSeasonal('${a.id}')" ${seasonClash(p)?'disabled':''}>Accept appointment</button><button onclick="teacherSeasonalDecision('${a.id}','Declined')">Decline offer</button>`:['Applied','Shortlisted'].includes(a.status)?`<button onclick="teacherSeasonalDecision('${a.id}','Withdrawn')">Withdraw application</button>`:''}`:''}</div>${a?.status==='Offered'&&seasonClash(p)?'<p class="reason">This appointment conflicts with confirmed work or travel time. Resolve the clash before accepting.</p>':''}${a?.response?`<p class="meta"><strong>Organiser response:</strong> ${esc(a.response)}</p>`:''}${a?.status==='Accepted'?'<p class="small">Confirmed weekdays now appear in your timetable. Cancellation must be arranged with the organiser.</p>':''}`:`<div class="actions"><button onclick="reviewApplicants('${p.id}')">Review applications (${applicants.length})</button><button onclick="toggleSeasonal('${p.id}')">${p.closed?'Reopen applications':'Close applications'}</button></div>`}</article>`}
function applySeasonal(id){let p=S.opportunities.find(p=>p.id===id);if(postingClosed(p)||remainingPlaces(p)<=0||applicationFor(id)){toast('This opportunity is closed, full or already applied for.');return}modal('Apply for '+p.kind.toLowerCase(),`<p><strong>${esc(p.title)}</strong><br>${esc(p.organiser)} · ${displayDate(p.from,{day:'numeric',month:'short',year:'numeric'})} – ${displayDate(p.to,{day:'numeric',month:'short',year:'numeric'})}</p><form onsubmit="saveSeasonalApplication(event,'${id}')"><label>Sample application statement<textarea name="statement" maxlength="1500" required placeholder="Use fictional experience only. Do not include contact details or identifiers."></textarea></label><div class="checks" style="margin:15px 0"><label><input type="checkbox" required>I am applying for all listed weekdays and understand organiser checks are still required.</label></div><p class="small">This demonstration stores the application in this browser only. No CV, credentials or personal information is needed.</p><button class="primary">Submit sample application</button></form>`)}
function saveSeasonalApplication(e,id){e.preventDefault();let p=S.opportunities.find(p=>p.id===id);if(postingClosed(p)||remainingPlaces(p)<=0||applicationFor(id)){toast('This role is no longer available.');return}S.applications.push({id:uid(),post:id,teacherId:activeId(),teacher:teacherName(activeId()),statement:new FormData(e.target).get('statement'),status:'Applied',date:today(),response:''});notify('Sample application submitted: '+p.title+'.');persist();document.getElementById('modal').close();render();toast('Application saved. Preview the organiser role to review it.')}
function reviewApplicants(id){let p=S.opportunities.find(p=>p.id===id),apps=S.applications.filter(a=>a.post===id);modal('Applications · '+p.title,`<p class="small">Fictional applicants only. Status updates are sample organiser decisions, not verified appointments.</p>${apps.map(a=>`<div class="card"><h3>${esc(a.teacher)}</h3><p>${esc(a.statement)}</p><form onsubmit="saveApplicationDecision(event,'${a.id}')"><label>Application status<select name="status">${(a.status==='Accepted'?['Accepted','Cancelled']:['Applied','Shortlisted','Offered','Rejected','Cancelled']).map(v=>`<option ${a.status===v?'selected':''}>${v}</option>`).join('')}</select></label><label style="margin-top:12px">Sample response<textarea name="response" required maxlength="1200">${esc(a.response)}</textarea></label><div class="actions"><button class="primary">Save decision</button></div></form></div>`).join('')||'<div class="empty">No applications yet. Preview Teacher, open this role and submit a sample application.</div>'}`)}
function saveApplicationDecision(e,id){e.preventDefault();let a=S.applications.find(a=>a.id===id),p=S.opportunities.find(p=>p.id===a.post),f=Object.fromEntries(new FormData(e.target));if(['Withdrawn','Declined','Cancelled','Rejected'].includes(a.status)){toast('This application is finished. Its status cannot be changed.');return}if(f.status==='Offered'&&a.status!=='Offered'&&remainingPlaces(p)<=0){toast('There are no unreserved places left.');return}if(f.status==='Offered'&&p.to<today()){toast('This opportunity has already ended.');return}Object.assign(a,f);notify('Application update: '+p.title+' · '+a.status+'.');persist();document.getElementById('modal').close();render();toast('Decision saved. Teacher can view it in Summer Work.')}
function acceptSeasonal(id){let a=S.applications.find(a=>a.id===id),p=S.opportunities.find(p=>p.id===a.post);if(a.status!=='Offered'||p.from<today()||seasonClash(p)){toast('This offer has started, is no longer available or conflicts with confirmed work.');return}a.status='Accepted';S.week=monday(p.from);notify('Appointment accepted: '+p.title+'.');persist();render();toast('Appointment confirmed. Open your timetable for '+displayDate(p.from)+'.')}
function teacherSeasonalDecision(id,status){let a=S.applications.find(a=>a.id===id);if(!['Applied','Shortlisted','Offered'].includes(a.status)){toast('This application cannot be changed.');return}a.status=status;notify('Summer application '+status.toLowerCase()+'.');persist();render();toast('Application updated.')}
function toggleSeasonal(id){let p=S.opportunities.find(p=>p.id===id);p.closed=!p.closed;persist();render();toast(p.closed?'Applications closed. Existing offers remain available to their recipients.':'Applications reopened, subject to the closing date.')}
function newSeasonalPost(){let board=S.role==='board',d=addDays(nextWorkday(today()),30);modal(board?'Post a supervision role':'Post summer work',`<form onsubmit="saveSeasonalPost(event)"><div class="formgrid"><label>Opportunity type<select name="kind">${(board?['Exam supervision']:['School camp','Summer course']).map(x=>`<option>${x}</option>`).join('')}</select></label><label>Role title<input name="title" required maxlength="120" placeholder="e.g. Summer geography course tutor"></label><label>Area<select name="area">${['North Dublin','South Dublin','West Dublin'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Number of places<input name="places" type="number" min="1" max="100" value="2" required></label><label>Programme begins<input type="date" name="from" min="${today()}" value="${d}" required></label><label>Programme ends<input type="date" name="to" min="${today()}" value="${addDays(d,4)}" required></label><label>Daily start<input type="time" name="start" value="09:00" required></label><label>Daily finish<input type="time" name="end" value="13:00" required></label><label>Applications close<input type="date" name="deadline" min="${today()}" value="${addDays(d,-7)}" required></label><label>Sample day rate (€)<input name="rate" type="number" min="1" max="2000" step=".01" value="120" required></label><label class="full">Role description<textarea name="details" required maxlength="1500"></textarea></label><label class="full">Requirements and checks<textarea name="requirements" required maxlength="1500">Sample organiser verification is required before any appointment.</textarea></label></div><p class="small">Schedule applies to every weekday in the date range (maximum 90 calendar days). Rates are sample assumptions. All listings are fictional.</p><button class="primary">Publish sample opportunity</button></form>`)}
function saveSeasonalPost(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),span=(new Date(f.to+'T12:00')-new Date(f.from+'T12:00'))/86400000;if(f.to<f.from||f.from<today()||f.deadline<today()||f.deadline>f.from||f.end<=f.start||span>89||postDays(f).length===0){toast('Check dates, times and deadline. Use 1–90 days including at least one weekday.');return}let board=S.role==='board';if(!['school','board'].includes(S.role)||board&&f.kind!=='Exam supervision'||!board&&!['School camp','Summer course'].includes(f.kind)){toast('Choose a role type your organiser can publish.');return}S.opportunities.unshift({...f,id:uid(),school:board?'board':S.school,organiser:board?'Sample National Examination Office':school(S.school).name,rate:Number(f.rate),places:Number(f.places),closed:false});seasonalFilter='All';notify('New sample opportunity: '+f.title+'.');persist();document.getElementById('modal').close();render();toast('Opportunity published in the sample work board.')}

function teacherWelcome(){return `<div class="welcome-wrap"><div class="welcome-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M6 10q8-3 14 2 6-5 14-2v21q-8-3-14 1-6-4-14-1z" fill="#a6cce8"/><path d="M20 12v20" stroke="#6354a6" stroke-width="2"/></svg></div><div class="eyebrow">Teacher setup · sample account</div><h1>How do you work?</h1><p class="muted">Choose your school arrangement first. We’ll show the pages that fit your teaching week.</p><form onsubmit="completeTeacherSetup(event)"><div class="setup-grid"><label class="choice-card"><input type="radio" name="arrangement" value="single" required onchange="updateWelcomeChoice(this.value)"><strong>One school</strong><span>I’m linked to one school and receive my cover offers from them.</span></label><label class="choice-card"><input type="radio" name="arrangement" value="multi" required onchange="updateWelcomeChoice(this.value)"><strong>Multiple schools</strong><span>I offer cover to schools in my selected area.</span></label></div><div class="welcome-details" id="welcomeDetails" hidden><div id="welcomeSchool"><label>Choose your school<select name="school">${schools.filter(x=>(PANEL_IDS[x.id]||[]).includes(activeId())).map(x=>`<option value="${x.id}" ${x.id===S.profile.school?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><p class="muted" style="margin:12px 0 0">Your school messages page will be available for leave, sickness reports and queries.</p></div><div id="welcomeArea" hidden><label>Choose your cover area<select name="area">${['North Dublin','South Dublin','West Dublin'].map(x=>`<option ${x===S.profile.area?'selected':''}>${x}</option>`).join('')}</select></label><p class="muted" style="margin:12px 0">Offers will match your area and subjects. These are sample area filters, not live distance estimates.</p><label>Subjects you can offer</label><div class="checks" style="margin-top:10px">${['Geography','Digital Technology','English','Mathematics'].map(x=>`<label><input type="checkbox" name="subjects" value="${x}" ${S.profile.subjects.includes(x)?'checked':''}>${x}</label>`).join('')}</div></div></div><div class="welcome-submit"><button class="primary" id="welcomeContinue" disabled>Open my workspace →</button></div></form><div class="signup-invite"><strong>New to Sub Teaching?</strong><p class="small">Try signing up with sample experience, credentials and fictional payment details.</p><button onclick="showSignup()">Sign up · sample profile</button></div><p class="welcome-note">You can change this later in Availability &amp; setup. Existing bookings and plans stay saved.</p><p class="small">Fictional teacher account. This is a demonstration, not a secure login.</p></div>`}
function updateWelcomeChoice(mode){document.getElementById('welcomeDetails').hidden=false;document.getElementById('welcomeSchool').hidden=mode!=='single';document.getElementById('welcomeArea').hidden=mode!=='multi';document.getElementById('welcomeContinue').disabled=false}
function completeTeacherSetup(e){e.preventDefault();const f=new FormData(e.target),mode=f.get('arrangement');if(!['single','multi'].includes(mode)){toast('Choose one school or multiple schools first.');return}if(mode==='multi'&&!f.getAll('subjects').length){toast('Choose at least one subject.');return}S.profile.mode=mode;S.profile.school=f.get('school');S.profile.area=f.get('area');if(mode==='multi')S.profile.subjects=f.getAll('subjects');S.profile.networkOptIn=mode==='multi'||S.profile.networkOptIn;S.teacherSetupComplete=true;S.page='overview';filter='pending';persist();render();document.getElementById('main').focus();window.scrollTo({top:0,behavior:'instant'});toast('Your workspace is ready.')}
function teacherDay(){const work=[...S.offers.filter(o=>belongs(o)&&o.status==='accepted'),...seasonalLessons()].filter(o=>new Date(o.date+'T'+o.end)>new Date()).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));const next=work[0]?.date||nextWorkday(today()),lessons=work.filter(o=>o.date===next),pending=eligibleOffers().filter(o=>status(o)==='pending');return header('My day',S.profile.mode==='single'?esc(school(S.profile.school).name):'Multiple schools · '+esc(S.profile.area))+`<div class="teacher-sample">Sample teacher: ${esc(teacherName(activeId()))} · ${displayDate(today(),{weekday:'long',day:'numeric',month:'long'})}</div><section class="day-status"><div class="eyebrow">${lessons.length?'Next confirmed work':'Next school day'} · ${displayDate(next)}</div><h2>${lessons.length?lessons.length+' confirmed '+(lessons.length===1?'session':'sessions'):'No cover confirmed yet'}</h2>${lessons.map(o=>`<div class="row"><div class="datebox"><strong>${o.start}</strong>${o.end}</div><div class="grow"><strong>${esc(o.subject)}</strong><div class="small">${esc(o.organiser||school(o.school).name)}${o.room?' · '+esc(o.room):''}</div></div></div>`).join('')||'<p>New offers may still arrive. No confirmed cover does not mean a confirmed day off.</p>'}<div class="day-actions"><button onclick="S.week=monday('${next}');nav('timetable')">View my week</button></div></section>${S.profile.mode==='single'?rosterCard(S.profile.school):''}<div class="section-label"><h2>Cover offers</h2><span class="count">${pending.length} pending</span></div><div class="tabs" aria-label="Filter cover offers">${['pending','accepted','all'].map(x=>`<button class="${filter===x?'selected':''}" aria-pressed="${filter===x}" onclick="filter='${x}';render()">${x==='pending'?'To respond':x==='accepted'?'Confirmed':'All offers'}</button>`).join('')}</div>${eligibleOffers().filter(o=>filter==='all'||status(o)===filter).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)).map(o=>offerCard(o,true)).join('')||'<div class="empty">No offers here. Your availability and school setup determine which offers you see.</div>'}<div class="quick-links"><button onclick="nav('setup')"><strong>Update availability</strong><span>Choose when you can teach.</span></button><button onclick="nav('timetable')"><strong>Timetable & lesson plans</strong><span>Prepare for your confirmed work.</span></button>${S.profile.mode==='single'?'<button onclick="nav(\'portal\')"><strong>School messages</strong><span>Leave, sickness reports and queries.</span></button>':'<button onclick="nav(\'summer\')"><strong>Summer Work</strong><span>Browse camps, courses and supervision.</span></button>'}</div>`}
function teacherWeek(){return `<div class="my-week">${timetable()}</div>`}
function withoutPageHeader(html){return html.replace(/^<div class="pagehead">[\s\S]*?<\/div><\/div><\/div>/,'')}
function teacherSetupPage(){return header('Availability & setup','Manage when you can teach and which schools can offer you cover.')+signupSummary()+networkPanel()+`<details class="settings-details"><summary>School arrangement & subjects <span class="small">${S.profile.mode==='single'?'One school':'Multiple schools'}</span></summary>${withoutPageHeader(settingsPage())}</details><section class="setup-panel"><h2>Your hourly availability</h2><p class="small">Changing availability does not cancel confirmed work. Your existing bookings must be resolved with the organiser first.</p>${withoutPageHeader(availabilityPage())}</section>`}
function render(){const saveMigration=!S.hourlyAvailabilityVersion||!S.networkVersion||!S.networkCalendarVersion||!S.teacherLayoutVersion;ensureSeasonal();ensureNetwork();ensureHourlyAvailability();if(!S.teacherLayoutVersion){S.teacherLayoutVersion=2;S.teacherSetupComplete=false;if(S.role==='teacher')S.page='overview'}const onboarding=S.role==='teacher'&&!S.teacherSetupComplete;const aliases={offers:'overview',plans:'timetable',availability:'setup',settings:'setup'};if(S.role==='teacher'&&aliases[S.page])S.page=aliases[S.page];let links=S.role==='teacher'?linksTeacher.filter(x=>x[0]!=='portal'||S.profile.mode==='single'):S.role==='board'?linksBoard:linksSchool;document.getElementById('nav').innerHTML=links.map(([p,i,n])=>`<button class="${S.page===p?'active':''}" onclick="nav('${p}')" ${S.page===p?'aria-current="page"':''}><span class="navicon" aria-hidden="true">${i}</span>${n}</button>`).join('');document.getElementById('roleBtn').value=S.role;document.getElementById('teacherPreviewWrap').hidden=S.role!=='teacher';document.getElementById('teacherPreview').innerHTML=teachers.map((n,i)=>`<option value="t${i}" ${activeId()==='t'+i?'selected':''}>${esc(n)}</option>`).join('');document.getElementById('alertCount').textContent=S.notifications.filter(n=>!n.read).length||'';document.body.classList.toggle('onboarding',onboarding);document.getElementById('alertsBtn').hidden=onboarding;let pages={overview:S.role==='teacher'?teacherDay:S.role==='board'?boardOverview:schoolOverview,summer:summerPage,earnings:earningsPage,timetable:S.role==='teacher'?teacherWeek:timetable,portal:portalPage,setup:teacherSetupPage,about:aboutPage,manage:managePage,staff:staffPage};document.getElementById('main').innerHTML=(onboarding?teacherWelcome():(pages[S.page]||teacherDay)())+`<footer class="footer">Sub Teaching · Fictional sample data · Saved on this browser only.<br>No secure logins or external notifications. No school or exam-body affiliation. Please use sample information only.</footer>`;if(document.getElementById('mode'))toggleMode();if(onboarding)closeNavigation(false);if(saveMigration)persist()}
function nav(page){S.page=page;persist();closeNavigation(false);render();document.getElementById('main').focus();window.scrollTo({top:0,behavior:'instant'})}
function setRole(role){seasonalFilter='All';S.role=role;S.earningsSchool='all';S.page='overview';if(role==='teacher')S.teacherSetupComplete=false;persist();closeNavigation(false);render();document.getElementById('main').focus();window.scrollTo({top:0,behavior:'instant'});toast('Previewing '+(role==='board'?'exam body':role)+' view. Sample accounts only.')}
function toggleNavigation(){const mobile=matchMedia('(max-width:700px)').matches;if(mobile){if(document.body.classList.contains('menu-open'))closeNavigation();else{document.body.classList.add('menu-open');document.querySelector('.layout').classList.remove('menu-collapsed');document.getElementById('menuToggle').setAttribute('aria-expanded','true');document.getElementById('main').inert=true;document.getElementById('alertsBtn').inert=true;document.querySelector('#nav button')?.focus()}}else{const collapsed=document.querySelector('.layout').classList.toggle('menu-collapsed');document.getElementById('menuToggle').setAttribute('aria-expanded',String(!collapsed))}}
function closeNavigation(focus=true){let wasOpen=document.body.classList.contains('menu-open');document.body.classList.remove('menu-open');document.getElementById('main').inert=false;document.getElementById('alertsBtn').inert=false;document.getElementById('menuToggle').setAttribute('aria-expanded',String(!matchMedia('(max-width:700px)').matches&&!document.querySelector('.layout').classList.contains('menu-collapsed')));if(wasOpen&&focus)document.getElementById('menuToggle').focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu-open')){e.preventDefault();closeNavigation()}if(e.key==='Tab'&&document.body.classList.contains('menu-open')){const items=[document.getElementById('menuToggle'),...document.querySelector('.sidebar').querySelectorAll('button,select')].filter(el=>!el.hidden&&el.offsetParent!==null),first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('resize',()=>closeNavigation(false));

const PANEL_IDS={oak:['t0','t1','t2','t3'],river:['t0','t4','t5','t6'],elm:['t1','t3','t4','t7'],hill:['t2','t5','t6','t7']};
const workProviders=[...schools,{id:'board',name:'Sample National Examination Office'}];
const providerName=id=>workProviders.find(x=>x.id===id)?.name||'Sample organiser';
const activeId=()=>S.activeTeacher||'t0';
const teacherName=id=>teachers[Number(String(id||'t0').slice(1))]||teachers[0];
const belongs=o=>(o.teacherId||'t0')===activeId();
const hoursFor=(start,end,breaks=0)=>Math.max(0,(mins(end)-mins(start)-Number(breaks))/60);

const TEACHING_HOURS=[9,10,11,12,14,15];
function oldAvailabilitySlots(value){if(Array.isArray(value))return [...new Set(value.map(Number).filter(h=>TEACHING_HOURS.includes(h)))].sort((a,b)=>a-b);return value==='Full day'?[...TEACHING_HOURS]:value==='Morning'?[9,10,11,12]:value==='Afternoon'?[14,15]:[]}
function ensureHourlyAvailability(){if(!S.hourlyAvailabilityVersion){Object.values(S.teacherAvailability).forEach(calendar=>Object.keys(calendar).forEach(d=>calendar[d]=oldAvailabilitySlots(calendar[d])));S.hourlyAvailabilityVersion=1}S.availability=S.teacherAvailability[activeId()]}
function selectedHours(id,d){return oldAvailabilitySlots(S.teacherAvailability[id]?.[d])}
function availabilityLabel(id,d){const hours=selectedHours(id,d);return hours.length?hours.length+' teaching '+(hours.length===1?'hour':'hours')+' available':'Unavailable'}
function availableAt(id,d){return availabilityLabel(id,d)}
function fitsTeachingDay(o){return mins(o.start)>=540&&mins(o.end)<=960&&mins(o.end)>mins(o.start)&&!(mins(o.start)<840&&mins(o.end)>780)}
function bookingHours(o){return TEACHING_HOURS.filter(h=>mins(o.start)<(h+1)*60&&mins(o.end)>h*60)}
function coversHourlyAvailability(id,o){return fitsTeachingDay(o)&&bookingHours(o).every(h=>selectedHours(id,o.date).includes(h))}
function lockedHours(id,d){return [...new Set(currentBookings(id).filter(b=>b.date===d).flatMap(bookingHours))]}
function availabilityPage(){const days=Array.from({length:14},(_,i)=>addDays(today(),i)).filter(onWeekday);return header('Choose your teaching hours','Hourly availability, 09:00–16:00. Lunch is always blocked from 13:00–14:00.')+`<form id="hourlyAvailability" onsubmit="saveAvailability(event)" class="card"><p class="small">Tick the hours you can work. A lesson must fit entirely inside selected hours. Confirmed work locks its teaching hours until the organiser cancels it.</p>${days.map((d,i)=>{const chosen=selectedHours(activeId(),d),locked=lockedHours(activeId(),d);return `<details class="availability-day" ${i<2?'open':''}><summary><strong>${displayDate(d)}</strong><span class="small" id="hoursCount-${d}">${chosen.length}/6 hours</span></summary><input type="hidden" name="dates" value="${d}"><div class="hour-grid">${[9,10,11,12,13,14,15].map(h=>h===13?`<div class="hour-lunch"><span aria-hidden="true">☕</span> 13:00–14:00 · Lunch · unavailable</div>`:`<label class="hour-slot ${locked.includes(h)?'locked':''}"><input type="checkbox" name="slots_${d}" value="${h}" ${chosen.includes(h)||locked.includes(h)?'checked':''} ${locked.includes(h)?'disabled':''} onchange="updateHoursCount('${d}')"><span>${String(h).padStart(2,'0')}:00–${String(h+1).padStart(2,'0')}:00${locked.includes(h)?'<small>Confirmed work</small>':''}</span></label>`).join('')}</div><div class="actions"><button type="button" onclick="setDayHours('${d}',true)">Select all teaching hours</button><button type="button" onclick="setDayHours('${d}',false)">Clear free hours</button></div>${currentBookings(activeId()).some(b=>b.date===d&&!fitsTeachingDay(b))?'<p class="reason">An existing booking extends outside the new teaching slots. It stays on your timetable; arrange any change with its organiser.</p>':''}</details>`}).join('')}<div class="availability-save"><button class="primary">Save hourly availability</button><p class="small">Lunch cannot be selected. Choices save on this browser.</p></div></form>`}
function setDayHours(d,on){document.querySelectorAll('input[name="slots_'+d+'"]').forEach(el=>{if(!el.disabled)el.checked=on});updateHoursCount(d)}
function updateHoursCount(d){const count=[...document.querySelectorAll('input[name="slots_'+d+'"]')].filter(el=>el.checked).length;document.getElementById('hoursCount-'+d).textContent=count+'/6 hours'}
function saveAvailability(e){e.preventDefault();const f=new FormData(e.target),days=[...new Set(f.getAll('dates'))];for(const d of days){if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!onWeekday(d)){toast('Choose valid school weekdays.');return}}for(const d of days){const picked=f.getAll('slots_'+d).map(Number).filter(h=>TEACHING_HOURS.includes(h));S.availability[d]=[...new Set([...picked,...lockedHours(activeId(),d)])].sort((a,b)=>a-b)}persist();render();toast('Hourly availability saved. Lunch remains blocked.')}
function matchTeacher(o,id){const p=S.teacherProfiles[id];if(!p)return {ready:false,checks:[{ok:false,text:'Unknown sample teacher'}],home:false};const home=o.school===p.school,inPanel=(PANEL_IDS[o.school]||[]).includes(id),local=school(o.school).area===p.area,consent=home||(p.mode==='multi'||p.networkOptIn)&&p.networkSchools.includes(o.school),timeOK=coversHourlyAvailability(id,o),clash=currentBookings(id).some(b=>b.id!==o.id&&overlap(o,b,b.school===o.school?0:Number(p.travel))),subject=p.subjects.includes(o.subject);const checks=[{ok:inPanel,text:inPanel?(home?'Member of this school’s regular sample panel':'Member of this school’s trusted sample network'):'Not on this school’s sample panel or network'},{ok:home||consent&&local,text:home?'Designated school matches':!local?'Outside the teacher’s selected area':consent?'Teacher has opted into cover at this local school':'Teacher has not opted into cover at this school'},{ok:subject,text:subject?'Subject is in the teacher’s selected preferences':'Subject is not in the teacher’s selected preferences'},{ok:timeOK,text:timeOK?'All required hourly slots are selected (lunch excluded)':!fitsTeachingDay(o)?'Outside 09:00–16:00 or overlaps lunch (13:00–14:00)':'One or more required hourly slots are not selected'},{ok:!clash,text:clash?'A confirmed booking or travel buffer overlaps':'No confirmed booking or travel-buffer conflict'}];return {ready:checks.every(c=>c.ok),checks,home}}
function suggestedTeachers(o){return teachers.map((n,i)=>({id:'t'+i,match:matchTeacher(o,'t'+i)})).filter(x=>x.match.ready).sort((a,b)=>Number(b.match.home)-Number(a.match.home)||teacherName(a.id).localeCompare(teacherName(b.id)))}
function candidateCheckboxes(o,chosen=[]){const candidates=suggestedTeachers(o);return `<div class="cardhead"><h3>Suggested teachers <span class="count">${candidates.length}</span></h3>${candidates.length?'<button type="button" onclick="selectSuggestedTeachers()">Select all</button>':''}</div><p class="small">Only teachers matching this school, subject, selected hourly availability and travel checks are shown. Send one job to several teachers; the first acceptance fills it.</p>${candidates.map(({id,match})=>`<div class="candidate-choice"><label><input type="checkbox" name="teacherIds" value="${id}" ${chosen.includes(id)?'checked':''}><span><strong>${esc(teacherName(id))}</strong><small>${match.home?'Regular school panel':'Opted-in local network'} · ${esc(S.teacherProfiles[id].subjects.join(' · '))}</small></span></label><details><summary>Why suggested?</summary>${matchList(match)}</details></div>`).join('')||'<div class="empty">No relevant teachers are available for these details. Change the date, subject or times, or update the teachers’ availability. Lunch is unavailable.</div>'}`}

function jobMembers(o){return S.offers.filter(b=>o.jobId?b.jobId===o.jobId:b.id===o.id)}
function status(o){if(o.status==='pending'&&o.jobId&&S.offers.some(b=>b.jobId===o.jobId&&b.status==='accepted'&&b.id!==o.id))return 'filled';return o.status==='pending'&&new Date(o.deadline).getTime()<=Date.now()?'expired':o.status}
function saveOffer(e){e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f),ids=[...new Set(f.getAll('teacherIds'))];if(!ids.length&&data.teacherId)ids.push(data.teacherId);const start=new Date(data.date+'T'+data.start),deadline=new Date(data.deadline);if(!schools.some(s=>s.id===data.school)||!fitsTeachingDay(data)||start<=new Date()||!Number.isFinite(start.getTime())||!Number.isFinite(deadline.getTime())||deadline<=new Date()||deadline>start||!Number.isFinite(Number(data.rate))||Number(data.rate)<=0||Number(data.rate)>500){toast('Check future lesson times, deadline and rate. Use 09:00–16:00, excluding lunch 13:00–14:00.');return}if(!ids.length){toast('Select at least one suggested teacher.');return}if(ids.some(id=>!matchTeacher(data,id).ready)){toast('One or more selected teachers no longer match. Check the refreshed suggestions.');refreshOfferMatchIfVisible();return}if(S.offers.some(o=>o.school===data.school&&o.room.toLowerCase()===data.room.toLowerCase()&&['pending','accepted'].includes(status(o))&&overlap(o,data))){toast('This school room already has overlapping cover.');return}const jobId=uid(),base={school:data.school,date:data.date,start:data.start,end:data.end,subject:data.subject,year:data.year,room:data.room,deadline:data.deadline,notes:data.notes,rate:Number(data.rate),jobId,status:'pending'};S.offers.unshift(...ids.map(id=>({...base,id:uid(),teacherId:id})));notify('New '+data.subject+' cover at '+school(data.school).name+' offered to '+ids.length+' relevant '+(ids.length===1?'teacher':'teachers')+'.');persist();document.getElementById('modal').close();render();toast('One cover job sent to '+ids.length+' '+(ids.length===1?'teacher':'teachers')+'. First acceptance fills it.')}
function refreshOfferMatchIfVisible(){if(document.getElementById('offerForm'))refreshOfferMatch()}
function respond(id,result){const o=S.offers.find(x=>x.id===id);if(!o||!belongs(o)){toast('This offer belongs to another sample teacher.');return}if(status(o)!=='pending'){toast('This offer is '+status(o)+' and can no longer be accepted.');render();return}if(result==='accepted'){const reason=blockReason(o);if(reason){toast(reason);render();return}const winner=jobMembers(o).find(b=>b.status==='accepted');if(winner){toast('Another teacher has already filled this lesson.');render();return}o.status='accepted';for(const other of jobMembers(o))if(other.id!==o.id&&other.status==='pending'){other.status='filled';other.filledBy=o.teacherId}notify(teacherName(o.teacherId)+' accepted '+o.subject+' on '+displayDate(o.date)+'. Other invitations for this job are now closed.')}else{o.status='declined';notify(teacherName(o.teacherId)+' declined '+o.subject+' on '+displayDate(o.date)+'.')}persist();render();toast(result==='accepted'?'Cover confirmed. Other invitations for this lesson are closed.':'Offer declined. Other invited teachers can still respond.')}
function schoolJobGroups(){const groups=new Map();S.offers.filter(o=>o.school===S.school).forEach(o=>{const key=o.jobId||o.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(o)});return [...groups.values()].sort((a,b)=>a[0].date.localeCompare(b[0].date)||a[0].start.localeCompare(b[0].start))}
function groupStatus(group){return group.some(o=>o.status==='accepted')?'accepted':group.some(o=>status(o)==='pending')?'pending':group.every(o=>o.status==='cancelled')?'cancelled':group.some(o=>status(o)==='expired')?'expired':group.every(o=>o.status==='declined')?'declined':status(group[0])}
function managePage(){return header('Your cover desk','One row per job. Invite several relevant teachers; the first acceptance fills the lesson.','<button class="primary" onclick="newOffer()">Offer cover +</button>')+schoolSelect()+schoolJobGroups().map(group=>{const o=group.find(b=>b.status==='accepted')||group[0],st=groupStatus(group);return `<article class="card"><div class="cardhead"><div><div class="eyebrow">${displayDate(o.date)} · ${o.start}–${o.end}</div><h3>${esc(o.subject)} · ${esc(o.year)}</h3><p class="small">Room ${esc(o.room)}${o.seriesId?' · Weekly recurring class':''}</p></div>${badge(st)}</div>${st==='accepted'?`<p><strong>Confirmed with ${esc(teacherName(o.teacherId))}</strong></p>`:`<p class="small">${group.length} ${group.length===1?'teacher invited':'teachers invited'} · Respond by ${displayDate(o.deadline.slice(0,10))} ${o.deadline.slice(11,16)}</p>`}<details class="lesson-details"><summary>Invitations & lesson instructions</summary>${group.map(b=>`<div class="row"><div class="grow">${esc(teacherName(b.teacherId))}</div>${badge(status(b))}</div>`).join('')}<p class="meta"><strong>Instructions:</strong> ${esc(o.notes)}</p></details>${['pending','accepted'].includes(st)?`<button class="danger" onclick="cancelOffer('${o.id}')">Cancel this job</button>`:''}</article>`}).join('')}
function schoolOverview(){const groups=schoolJobGroups(),pending=groups.filter(g=>groupStatus(g)==='pending'),confirmed=groups.filter(g=>groupStatus(g)==='accepted'),unread=S.tickets.filter(t=>t.school===S.school&&t.status==='Submitted');return header('School cover overview',esc(school(S.school).name),'<button class="primary" onclick="newOffer()">Offer cover +</button>')+schoolSelect()+`<div class="stats">${stat(pending.length,'Unfilled cover jobs')}${stat(confirmed.length,'Confirmed lessons')}${stat(pending.filter(g=>new Date(g[0].deadline)-Date.now()<86400000).length,'Unfilled · due within 24 hours')}${stat(unread.length,'Staff requests to acknowledge')}</div><div class="card"><h2>Cover needing a response</h2>${pending.slice(0,8).map(group=>{const o=group[0];return `<div class="row"><div class="datebox"><strong>${o.start}</strong>${displayDate(o.date,{day:'numeric',month:'short'})}</div><div class="grow"><strong>${esc(o.subject)} · ${esc(o.year)}</strong><div class="small">${group.length} ${group.length===1?'invitation':'invitations'} · Room ${esc(o.room)}</div></div>${badge('pending')}</div>`}).join('')||'<p class="muted">No unfilled jobs.</p>'}<div class="actions"><button onclick="nav('manage')">Manage cover jobs</button><button onclick="nav('staff')">Check relevant teachers</button></div></div><div class="notice green">Only matching teachers are suggested when you post. Declining keeps the job open for the other recipients; accepting confirms one teacher and closes the remaining invitations in this browser demo.</div>`}
function cancelOffer(id){const o=S.offers.find(x=>x.id===id);modal('Cancel this cover job?',`<p>${esc(o.subject)} · ${displayDate(o.date)} · ${o.start}–${o.end}</p><p>This cancels the confirmed booking and every invitation for this job. Saved lesson plans are retained.</p><button class="danger" onclick="confirmCancel('${id}')">Confirm cancellation</button>`)}
function confirmCancel(id){const o=S.offers.find(x=>x.id===id);jobMembers(o).forEach(b=>b.status='cancelled');notify('Cover job cancelled: '+o.subject+' on '+displayDate(o.date)+'. All invitations closed.');persist();document.getElementById('modal').close();render();toast('Cover job and all its invitations cancelled.')}

window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const incoming=JSON.parse(e.newValue);if(incoming.version!==1)return;const view={role:S.role,page:S.page,activeTeacher:S.activeTeacher,teacherSetupComplete:S.teacherSetupComplete,week:S.week,school:S.school,earningsSchool:S.earningsSchool,signupStep:S.signupStep,matchDraft:S.matchDraft};S=Object.assign(incoming,view);ensureSeasonal();ensureNetwork();ensureHourlyAvailability();if(!document.getElementById('modal').open&&!document.body.classList.contains('menu-open')&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))render()}catch{}});
new ResizeObserver(entries=>document.documentElement.style.setProperty('--header-height',entries[0].contentRect.height+'px')).observe(document.querySelector('.top'));
render();persist();new MutationObserver(()=>{if(document.getElementById('mode'))toggleMode()}).observe(document.getElementById('main'),{childList:true});setInterval(()=>{if(!document.getElementById('modal').open&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)&&!document.body.classList.contains('menu-open')&&!(S.role==='teacher'&&!S.teacherSetupComplete)&&['overview','manage','summer'].includes(S.page)){const opened=[...document.querySelectorAll('#main details')].map(el=>el.open);render();document.querySelectorAll('#main details').forEach((el,i)=>{if(i<opened.length)el.open=opened[i]})}},60000);closeNavigation(false);
</script></body></html>
